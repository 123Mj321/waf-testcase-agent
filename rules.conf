SecRule ARGS:id "@rx (?i:union.+select|or\s+1\s*=\s*1|drop\s+table)" \
  "id:1001,phase:2,deny,status:403,log,msg:'SQLi keywords in id'"

SecRule ARGS:q "@contains <script" \
  "id:1002,phase:2,deny,status:403,log,t:lowercase,msg:'script tag in q'"

SecRule ARGS:file "@rx (?:\.\./){2,}" \
  "id:1003,phase:2,deny,status:403,log,t:urlDecodeUni,msg:'path traversal'"

SecRule REQUEST_HEADERS:User-Agent "@rx (?i:sqlmap|nikto|gobuster)" \
  "id:1004,phase:1,deny,status:403,log,msg:'scanner UA'"

SecRule REQUEST_METHOD "!@within GET POST" \
  "id:1005,phase:1,deny,status:405,log,msg:'method not allowed'"

SecRule REQUEST_URI "@beginsWith /api/health" \
  "id:1006,phase:1,pass,nolog,ctl:ruleEngine=off"

SecRule REQUEST_HEADERS:Referer "@rx (?i:evil\.com|malicious\.site)" \
  "id:1007,phase:1,deny,status:403,log,msg:'malicious referer domain'"

SecRule REQUEST_BODY "@rx (?i:select\s.+\sfrom\s)" \
  "id:1008,phase:2,deny,status:403,log,msg:'SQLi in body'"