[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "waf-testcase-agent"
version = "0.1.0"
description = "ModSecurity SecRule testcase tooling"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.24,<1.0",
    "pytest>=8.0,<9.0",
]

[project.scripts]
testcase-gen = "testcase_gen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
